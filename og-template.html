<!DOCTYPE html>
<html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#fafaf9;font-family:'General Sans',-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.bg-lines{position:absolute;inset:0;opacity:.06}
.content{text-align:center;z-index:1}
.logo{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:32px}
.logo-mark{width:40px;height:40px;border-radius:10px;background:#1a1a1a;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:22px;height:22px;color:#fff}
.logo-text{font-size:26px;font-weight:600;color:#1a1a1a;letter-spacing:-.01em}
h1{font-size:56px;font-weight:700;color:#1a1a1a;letter-spacing:-.04em;line-height:1.1;margin-bottom:20px}
p{font-size:22px;color:#5a5a58;font-weight:500;max-width:700px;margin:0 auto 28px;line-height:1.5}
.stats{display:flex;gap:32px;justify-content:center}
.stat{background:#fff;border:1px solid #e8e7e4;border-radius:10px;padding:12px 20px;text-align:center}
.stat-num{font-size:22px;font-weight:700;color:#1a1a1a;display:block}
.stat-label{font-size:12px;color:#9a9a98;font-weight:500}
</style></head>
<body>
<div class="content">
<div class="logo">
<div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z"/></svg></div>
<span class="logo-text">SonicFlow</span>
</div>
<h1>Sound design, shipped as code.</h1>
<p>84 interaction sounds generated live from oscillators.<br>No audio files. No dependencies. Under 3 kB.</p>
<div class="stats">
<div class="stat"><span class="stat-num">84</span><span class="stat-label">sounds</span></div>
<div class="stat"><span class="stat-num">8</span><span class="stat-label">categories</span></div>
<div class="stat"><span class="stat-num">&lt;3kB</span><span class="stat-label">gzipped</span></div>
<div class="stat"><span class="stat-num">0</span><span class="stat-label">audio files</span></div>
</div>
</div>
</body></html>
